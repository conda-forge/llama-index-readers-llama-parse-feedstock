schema_version: 1

context:
  name: llama-index-readers-llama-parse
  version: "0.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_readers_llama_parse-${{ version }}.tar.gz
  sha256: 34b85b942e0acd4b17db60d588289eabb9f61cc19d7ba55788a1703f1dc4391f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.13.0,<0.15
    - llama-parse >=0.5.0
    - greenlet

tests:
  - python:
      imports:
        - llama_index.readers.llama_parse
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: llama-index readers llama-parse integration
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/readers/llama-index-readers-llama-parse

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
