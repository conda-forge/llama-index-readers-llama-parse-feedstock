schema_version: 1

context:
  name: llama-index-readers-llama-parse
  version: 0.7.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/llama_index_readers_llama_parse-${{ version }}.tar.gz
  sha256: 7cce6e12b0fff514884809c520d8b5bb64353d35fc0192ca26cae68ae092a789

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - llama-index-core >=0.13.0,<0.15
    - llama-parse >=0.5.0

tests:
  - python:
      imports:
        - llama_index.readers.llama_parse
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: llama-index readers llama-parse integration
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/readers/llama-index-readers-llama-parse

extra:
  recipe-maintainers:
    - pavelzw
    - jan-janssen
